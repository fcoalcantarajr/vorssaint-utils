name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    # Fork-only check: the arm64 macOS pool keeps cancelling this job before it
    # gets a runner, so it runs on the separate Intel pool. That image has the
    # same Xcode 16.2 and macOS 15.2 SDK.
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      # build.sh targets arm64-apple-macosx14.0, so on Intel this is a cross
      # compile. It shows the code builds with Swift 6.0.3, but the arm64
      # binaries cannot run here, so Selftest and Unit tests are left out.
      - name: Build
        run: ./build.sh

  build:
    name: Build & selftest
    # Disabled on this branch: it already ran on the PR branch, and skipping it
    # keeps this check off the busy arm64 queue.
    if: false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test
